<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#128019; SECURE CART | Little Rooster </title>
    <link rel="stylesheet" href="addtocart.css">
    </link>
</head>

<body>
    <h1>&#128019; Little Rooster</h1>
    <h2>Secure Payment</h2>
    <form>
        <div>

        </div>
        <label for="name">Name As Per Card</label>
        <p>
            <input type="text" name="name" id="name" placeholder="Enter your name" required>
        </p>
        <label for="number">Card Number</label>
        <p>
            <input type="text" name="number" id="number" placeholder="Enter your Card number" maxlength="12" required>
        </p>
        <label for="address">Street Address</label>
        <p>
            <input type="text" name="address" id="address" placeholder="Street Address" required>
        </p>
        <p>
            <input type="text" name="address2" id="address2" placeholder="Apt No" required>
        </p>
        <p>
            <input type="text" name="City" id="City" placeholder="City" required>
            <input type="text" name="Region" id="Region" placeholder="Region" required>
        </p>
        <label for="zipcode">Zip-code</label>

        <p>
            <input type="text" name="zipcode" id="zipcode" placeholder="Zip-code" required>
        </p>
    </form>
    <button>Submit</button>

</body>

</html>
