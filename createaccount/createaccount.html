<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#x1F413; Create Account | Little Rooster</title>
  <link rel="stylesheet" href="createaccout.css">
</head>

<body>
  <h1>&#128019; Little Roo<span class="tag1">ster</span></h1>
  <!-- Creating account  -->
  <div>
    <h2>Create an Online Account</h2>
  </div>
  <p>Find your account with phone or email, or join below.</p>
  <form action="Details" class="cr1">
    <div class="cr2">
      <label for="First-Name">First Name</label>
      <input type="text" id="First-Name" name="First Name" placeholder="First name">
      </div>
      <div class="cr3">
        <label for="Last-Name" >Last Name</label>
      <input type="text" id="Last-name" name="Last Name" placeholder="Last name">
      </div>
      
    </div>
    <div>
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="(999)999-9999">
    </div>
    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="name@domine.com">
    </div>
    <div>
      <label for="password">Create a Password</label>
      <input id="password" type="password" name="password">
    </div>
    <div>
      <input type="checkbox" id="checkbox">
      <label for="checkbox">
        <small>I am at least 21 years old or older and I agree to the legal Terms and Conditions<br>
          of this program and that I am signing up to receive emails from Total Wine & More</small>
      </label>
    </div>
    <a href="Viwe Terms and Conditions"><small>View Terms and Conditions</small></a>
    <div>
      <input type="button" id="Create Account" name="Create Account" value="Create Account">
    </div>
  </form>

  <!--footer page for create account page-->
  <hr>
  <footer>
    <table>
      <tr>
        <td><a href="Terms and Conditions"><small>Terms and Conditions</small></a></td>
        <td>|</td>
        <td><a href="Privacy Policy"><small>Privacy Policy</small></a></td>
      </tr>
    </table>
    <p>
      <small>Due to legal restrictions, we must offer varying programs by state</small>
    </p>

  </footer>
</body>

</html>
