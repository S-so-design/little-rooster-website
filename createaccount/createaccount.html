<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#x1F413; Create Account | Little Rooster</title>
  <link rel="stylesheet" href="createaccount.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
</head>

<body>
  <h1>&#128019; Little Roo<span id="tag1">ster</span></h1>
  <!-- Creating account  -->

  <div class="form1">
    <h2>Create an Online Account</h2>
  </div>
  <div class="msg1">
    <p>Find your account with phone or email, or join below.</p>
  </div>
  <div class="Details">
    <form action="Details">
      <div class="name">
        <label for="First-Name">First Name</label>
        <input type="text" id="First-Name" name="First Name" placeholder="First name" required>
        <label for="Last-Name">Last Name</label>
        <input type="text" id="Last-name" name="Last Name" placeholder="Last name" required>
      </div>
      <div class="phone">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="(999)999-9999" required>
      </div>
      <div class="email">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@domine.com" required>
      </div>
      <div class="password">
        <label for="password">Create a Password</label>
        <input id="password" type="password" name="password" required>
      </div>
      <div class="age">
        <input type="checkbox" id="checkbox" required>
        <label for="checkbox">
          <small>I am at least 21 years old or older and I agree to the legal Terms and Conditions<br>
            of this program and that I am signing up to receive emails from Total Wine & More</small></label>
      </div>
      <div class="terms">
        <a href="Viwe Terms and Conditions"><small>View Terms and Conditions</small></a>
      </div>
      <div class="createaccountbutton">
        <input type="button" id="Create Account" name="Create Account" value="Create Account">
      </div>

    </form>
  </div>


  <!--footer page for create account page-->

  <footer>
    <div class="terms">
      <a href="Terms and Conditions"><small>Terms and Conditions </small></a>
      <span> | </span>
      <a href="Privacy Policy"><small> Privacy Policy</small></a>
    </div>
    <div class="lastline">
      <p>
        <small>Due to legal restrictions, we must offer varying programs by state</small>
      </p>
    </div>
  </footer>
</body>

</html>
