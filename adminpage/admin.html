<!DOCTYPE html>
<html>

<head>
  <title>Admin | Little Rooster 🐓</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

  <div class="container_for_headning">
    <h1 class="title">Little Roo<span class="headningpart">ster</span> 🐓</h1>
  </div>

  <div class="beam1_container">
    <h2>Inventory Management</h2>
    <form>
      <div class="mb-3">
        <label for="productName" class="form-label">Product Name</label>
        <input type="text" class="form-control" id="productName" required>
      </div>

      <div class="mb-3">
        <label for="brandName" class="form-label">Brand Name</label>
        <input type="text" class="form-control" id="brandName" required>
      </div>

      <div class="form-check" autocomplete="off">
        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
        <label class="form-check-label" for="radioDefault1" id="radioDefault1">whiskey</label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2">
        <label class="form-check-label" for="radioDefault2" id="radioDefault2">vodka</label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault3">
        <label class="form-check-label" for="radioDefault3" id="radioDefault3">Beer</label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault4">
        <label class="form-check-label" for="radioDefault4" id="radioDefault4">wine</label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault5">
        <label class="form-check-label" for="radioDefault4" id="radioDefault5">Tequila</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault6">
        <label class="form-check-label" for="radioDefault4" id="radioDefault6">Rum</label>
      </div>
      <div class="lastpart">
        <button type="button" class="btn btn-outline-success mt-2" id="save">Save</button>
        <a href="FINALREPORT.html" class="btn btn-outline-warning mt-2">Next</a>
        <button type="button" class="btn btn-outline-danger mt-2">Exit</button>
      </div>

    </form>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
</body>

</html>
