<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADMIN FINAL REPORT | LITTLE ROOSTER 🐓</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>

<body style="font-family: 'Inter', sans-serif;">

  <!-- NAVBAR -->
  <nav class="navbar navbar-light bg-warning">
    <div class="container-fluid">
      <a class="navbar-brand mb-0 h1">Little Rooster 🐓</a>

      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container mt-4">

    <h2 class="mb-4">FINAL INVENTORY REPORT</h2>

    <!-- MAIN TABLE -->
    <table class="table table-striped">
      <thead>
        <tr>
          <th>S.No</th>
          <th>Product Name</th>
          <th>Brand Name</th>
          <th>Type</th>
          <th>Quantity</th>
          <th>Bottles</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th>1</th>
          <td>Mark</td>
          <td>Otto</td>
          <td>@mdo</td>
          <td>8</td>
          <td>1</td>
        </tr>
      </tbody>
    </table>

    <!-- SUMMARY TABLE -->
    <table class="table w-50">
      <tbody>
        <tr>
          <td><strong>Total Items:</strong></td>
          <td>items-number</td>
        </tr>
        <tr>
          <td><strong>Total Bottles:</strong></td>
          <td>bottle-numbers</td>
        </tr>
        <tr>
          <td><strong>Total Cases:</strong></td>
          <td>total-cases-number</td>
        </tr>
      </tbody>
    </table>

    <!-- BUTTON GROUP -->
    <div class="btn-group mt-3" role="group" aria-label="Report actions">
      <button type="button" class="btn btn-danger">SAVE REPORT</button>
      <button type="button" class="btn btn-warning">DOWNLOAD</button>
      <button type="button" class="btn btn-success">BACK</button>
    </div>

  </div>

  <!-- FOOTER BAR -->
  <div class="text-bg-dark p-3 mt-5"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
